<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0F172A" />
  <title>Arohasetu — Enterprise Clinical Monitoring Portal</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="alternate icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/assets/logo-192.png" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Typography: Inter, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Production Vendor Libraries (Local offline-first) -->
  <script src="/vendor/react.min.js"></script>
  <script src="/vendor/react-dom.min.js"></script>
  <script src="/vendor/tailwindcss.js"></script>

  <!-- Tailwind Configuration matching Epic/Teladoc clinical design system -->
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'Plus Jakarta Sans', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
          },
          colors: {
            slate: {
              50: '#F8FAFC',
              100: '#F1F5F9',
              200: '#E2E8F0',
              300: '#CBD5E1',
              400: '#94A3B8',
              500: '#64748B',
              600: '#475569',
              700: '#334155',
              800: '#1E293B',
              900: '#0F172A',
              950: '#020617',
            },
            amber: {
              50: '#FFFBEB',
              100: '#FEF3C7',
              200: '#FDE68A',
              600: '#D97706',
              700: '#B45309',
              800: '#92400E',
              900: '#78350F',
            },
            rose: {
              50: '#FFF1F2',
              100: '#FFE4E6',
              200: '#FECDD3',
              600: '#E11D48',
              700: '#BE123C',
              800: '#9F1239',
              900: '#881337',
            },
            emerald: {
              50: '#ECFDF5',
              100: '#D1FAE5',
              200: '#A7F3D0',
              500: '#10B981',
              600: '#059669',
              700: '#047857',
              800: '#065F46',
            }
          },
          boxShadow: {
            '2xs': '0 1px 2px 0 rgba(15, 23, 42, 0.03)',
            'xs': '0 1px 2px 0 rgba(15, 23, 42, 0.05)',
            'card': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px -1px rgba(15, 23, 42, 0.05)',
          }
        }
      }
    };
  </script>

  <style>
    /* Clinical typography refinements */
    body {
      font-family: 'Inter', 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #F8FAFC;
      color: #0F172A;
      -webkit-font-smoothing: antialiased;
    }
    .tabular-nums {
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body class="h-full bg-slate-50 text-slate-900">
  <!-- React App Root Container -->
  <div id="root">
    <!-- Initial Clinical Splash State with Automated Recovery Watchdog -->
    <div id="initial-splash-container" class="min-h-screen flex items-center justify-center bg-slate-50">
      <div class="text-center p-8 max-w-sm mx-auto">
        <div id="splash-icon-pulse" class="w-12 h-12 rounded-xl bg-[#103663] text-[#08A6A6] flex items-center justify-center mx-auto mb-3 shadow-md animate-pulse">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
        </div>
        <h2 class="text-base font-bold text-slate-900">Arohasetu Clinical Portal</h2>
        <p id="splash-status-text" class="text-xs text-slate-500 mt-1">Initializing Real-time Telemetry Engine...</p>

        <!-- Progressive Recovery / Timeout Diagnostic Container (shown if startup takes longer than 4s) -->
        <div id="splash-recovery-box" style="display:none;" class="mt-4 p-3.5 bg-amber-50 border border-amber-200 rounded-xl text-left text-xs text-amber-900 animate-in fade-in">
          <div class="flex items-center gap-2 font-semibold mb-1">
            <span class="w-2 h-2 rounded-full bg-amber-500 animate-ping"></span>
            <span id="splash-recovery-title">Startup taking longer than expected</span>
          </div>
          <p id="splash-recovery-msg" class="text-[11px] text-amber-700 leading-normal">
            Verifying telemetry connection and application assets...
          </p>
          <div class="mt-3 flex items-center gap-2">
            <button onclick="window.location.reload()" class="px-3 py-1.5 bg-slate-900 text-white rounded-lg text-xs font-semibold hover:bg-slate-800 transition-colors cursor-pointer shadow-xs">
              Retry Connection
            </button>
            <button onclick="try{localStorage.removeItem('arohasetu_token');}catch(e){}window.location.reload();" class="px-3 py-1.5 bg-white border border-slate-200 text-slate-700 rounded-lg text-xs font-semibold hover:bg-slate-50 transition-colors cursor-pointer shadow-xs">
              Reset Session
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Startup connection watchdog script -->
  <script>
    (function() {
      var splashText = document.getElementById('splash-status-text');
      var recoveryBox = document.getElementById('splash-recovery-box');
      var recoveryTitle = document.getElementById('splash-recovery-title');
      var recoveryMsg = document.getElementById('splash-recovery-msg');

      // Phase 1: 3.5s soft warning
      setTimeout(function() {
        if (document.getElementById('initial-splash-container')) {
          if (splashText) splashText.textContent = "Connecting to Telemetry Services...";
          if (recoveryBox) {
            recoveryBox.style.display = "block";
            if (!navigator.onLine && recoveryMsg) {
              recoveryTitle.textContent = "Network Offline Detected";
              recoveryMsg.textContent = "Your browser appears to be offline. Reconnecting to local cache...";
            }
          }
        }
      }, 3500);

      // Phase 2: 7.5s hard timeout with clear recovery instructions
      setTimeout(function() {
        if (document.getElementById('initial-splash-container')) {
          if (splashText) splashText.textContent = "Telemetry Gateway Unreachable";
          var pulseIcon = document.getElementById('splash-icon-pulse');
          if (pulseIcon) pulseIcon.classList.remove('animate-pulse');
          if (recoveryTitle) recoveryTitle.textContent = "Connection Timeout";
          if (recoveryMsg) {
            recoveryMsg.innerHTML = "Unable to connect to live telemetry gateway after 7.5 seconds. Click <strong>Retry Connection</strong> to reload, or <strong>Reset Session</strong> if your session token was interrupted.";
          }
        }
      }, 7500);
    })();
  </script>

  <!-- Clinical error trap to prevent silent white screens -->
  <script>
    window.addEventListener('error', function(e) {
      console.error('Captured Runtime Error:', e.error || e.message);
      var box = document.getElementById('runtime-error-box') || document.createElement('div');
      box.id = 'runtime-error-box';
      box.style = 'position:fixed;bottom:20px;left:20px;right:20px;z-index:99999;background:#fff1f2;border:2px solid #e11d48;padding:16px;border-radius:12px;color:#9f1239;font-family:monospace;font-size:13px;box-shadow:0 10px 25px rgba(0,0,0,0.15);';
      box.innerHTML = '<strong>Arohasetu UI Runtime Diagnostic:</strong><br/>' + (e.error ? (e.error.stack || e.error.message) : e.message);
      document.body.appendChild(box);
    });
  </script>

  <!-- Arohasetu Precompiled Production Bundle (Instant startup, 0ms latency) -->
  <script src="/bundle.js"></script>

</body>
</html>
